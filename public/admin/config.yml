backend:
  name: github
  repo: thepsychologysquare/psychology-square-v2
  branch: main
  base_url: https://decap-proxy.thepsychologysquare.workers.dev
  auth_endpoint: auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "categories"
    label: "Categories"
    folder: "src/content/categories"
    create: true
    slug: "{{fields.name}}"
    fields:
      - {label: "Name", name: "name", widget: "string", hint: "e.g. Anxiety, Grief & Loss, Stress & Burnout. Add a new category here first, then it becomes pickable on Articles/Worksheets/Assessments."}

  - name: "articles"
    label: "Articles"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", hint: "One or two sentences — shows on article cards and in search results."}
      - {label: "Featured Image", name: "image", widget: "image", required: false, hint: "Optional header image for the article card."}
      - {label: "Image Alt Text", name: "imageAlt", widget: "string", required: false, hint: "Brief description of the image for accessibility/SEO."}
      - label: "Category"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
        hint: "Search for an existing category. Don't see it? Go to the Categories tab, add it there, then come back here."
      - {label: "Subcategory", name: "subcategory", widget: "string", required: false, hint: "Optional — a more specific label, e.g. 'coping-skills' or 'couples-conflict'."}
      - {label: "Tags", name: "tags", widget: "list", default: []}
      - label: "Author"
        name: "author"
        widget: "select"
        options: ["Muhammad Sohail", "Sehar Waheed"]
      - label: "Reviewed By"
        name: "reviewedBy"
        widget: "select"
        options: ["Muhammad Sohail", "Sehar Waheed"]
        required: false
      - {label: "Publish Date", name: "publishDate", widget: "datetime"}
      - {label: "Draft", name: "draft", widget: "boolean", default: false, hint: "Turn ON to hide this article from the live site until it's ready."}
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "worksheets"
    label: "Worksheets"
    folder: "src/content/worksheets"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", hint: "One or two sentences shown on the card."}
      - {label: "Featured Image", name: "image", widget: "image", required: false, hint: "Optional thumbnail image for the worksheet card."}
      - {label: "Image Alt Text", name: "imageAlt", widget: "string", required: false, hint: "Brief description of the image for accessibility/SEO."}
      - label: "Tier"
        name: "tier"
        widget: "select"
        options:
          - {label: "Free", value: "free"}
          - {label: "Paid", value: "paid"}
      - label: "Topic"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
        default: "general"
        hint: "Search for an existing category. Don't see it? Go to the Categories tab, add it there, then come back here."
      - label: "Age"
        name: "age"
        widget: "select"
        multiple: true
        default: ["adults"]
        options:
          - {label: "Children", value: "children"}
          - {label: "Adults", value: "adults"}
        hint: "Select both if the worksheet suits either age group."
      - label: "PDF File"
        name: "fileUrl"
        widget: "file"
        required: false
        media_folder: "public/worksheets"
        public_folder: "/worksheets"
        hint: "Only needed for Free worksheets — this is what visitors download directly. Leave blank for Paid worksheets."
      - {label: "Order", name: "order", widget: "number", default: 0, required: false, hint: "Lower numbers show first. Leave as 0 if you don't care about order."}
      - {label: "Draft", name: "draft", widget: "boolean", default: false, hint: "Turn ON to hide this worksheet from the live site until it's ready."}

  # The "courses" collection used to live here. Course creation and
  # editing (title, slug, description, pricing, quiz, modules, lessons --
  # everything) now happens entirely in /dashboard/courses, backed by D1.
  # Removed from Decap on purpose so there is only one place to manage a
  # course. See migrations-2026-08-course-entity.sql / src/lib/courses.ts.
  - name: "assessments"
    label: "Assessments"
    folder: "src/content/assessments"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Description", name: "description", widget: "text", hint: "What the scale measures, in one or two sentences."}
      - label: "Topic"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name"]
        display_fields: ["name"]
        value_field: "{{slug}}"
        default: "general"
        hint: "Search for an existing category. Don't see it? Go to the Categories tab, add it there, then come back here."
      - label: "Age"
        name: "age"
        widget: "select"
        multiple: true
        default: ["adults"]
        options:
          - {label: "Children", value: "children"}
          - {label: "Adults", value: "adults"}
      - {label: "Public PDF Link", name: "pdfUrl", widget: "string", hint: "Link to the official, publicly available PDF of the scale — do not upload a copy, link to the original publisher/source."}
      - {label: "How to Score", name: "scoringSummary", widget: "text", hint: "A short, clear summary of how scoring works and what the score ranges mean."}
      - {label: "Source / Citation", name: "sourceNote", widget: "string", required: false, hint: "Optional — e.g. 'Spitzer et al., 2006' or the publisher name."}
      - {label: "Order", name: "order", widget: "number", default: 0, required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}